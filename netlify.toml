# Configuração do Netlify (deploy grátis)
[build]
  publish = "public"            # site estático (public/index.html)
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# As rotas /api/* são resolvidas pelas próprias funções (config.path).
# A função poll.mjs roda sozinha a cada 1 min (config.schedule).
